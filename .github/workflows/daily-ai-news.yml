name: Daily AI News Radar

on:
  schedule:
    # 北京时间每天早上 8:30 自动运行 (对应 UTC 时间 0:30)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync

      - name: Run Horizon Radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run horizon --hours 24 --language zh --log-level INFO

      - name: Push Summary to DingTalk Webhook
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python -c '
          import os, time, hmac, hashlib, base64, urllib.parse, urllib.request, json, glob

          secret = os.environ.get("DINGTALK_SECRET")
          webhook = os.environ.get("DINGTALK_WEBHOOK")
          
          if not secret or not webhook:
              print("Missing DINGTALK_SECRET or DINGTALK_WEBHOOK secret.")
              exit(1)

          timestamp = str(round(time.time() * 1000))
          secret_enc = secret.encode("utf-8")
          string_to_sign = f"{timestamp}\n{secret}"
          string_to_sign_enc = string_to_sign.encode("utf-8")
          hmac_code = hmac.new(secret_enc, string_to_sign_enc, digestmod=hashlib.sha256).digest()
          sign = urllib.parse.quote_plus(base64.b64encode(hmac_code))
          
          target_url = f"{webhook}&timestamp={timestamp}&sign={sign}"
          
          # 优先匹配带有 zh 标记或最新的摘要 Markdown 文件
          files = sorted(glob.glob("data/summaries/horizon-*.md"))
          if files:
              # 如果存在 zh 结尾的文件，优先选用
              zh_files = [f for f in files if "zh" in f]
              target_file = zh_files[-1] if zh_files else files[-1]
              
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              
              payload = {
                  "msgtype": "markdown",
                  "markdown": {
                      "title": "🌅 今日 AI 新闻雷达",
                      "text": content[:4000]
                  }
              }
              
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(target_url, data=data, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as response:
                      print("DingTalk Push Response:", response.read().decode("utf-8"))
              except Exception as e:
                  print("Failed to push to DingTalk:", e)
          else:
              print("No summary markdown file found.")
          '
