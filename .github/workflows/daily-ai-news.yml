name: Daily AI News Radar

on:
  schedule:
    # 北京时间每天早上 8:30 自动运行 (对应 UTC 时间 0:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动触发运行

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync

      - name: Run Horizon Radar & Push Notifications
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          uv run horizon --hours 24 --log-level INFO
